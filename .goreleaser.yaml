# GoReleaser config for tfperms.
#
# Schema: v2 (https://goreleaser.com/customization/).
#
# Status (Epic 8 will flip this): `release.disable: true` keeps `goreleaser
# release` from publishing anywhere. Snapshot builds via
# `goreleaser release --snapshot --clean` are unaffected and are the
# expected workflow until the GitHub publishing step is wired up.
#
# Build-matrix invariants (do not weaken without updating the PDR):
#   - Linux + macOS + Windows on amd64 + arm64, except windows/arm64 which
#     is explicitly ignored. There is no demand for it and it is not free
#     to ship — drop it until someone asks.
#   - All builds are CGO_ENABLED=0 static binaries. tfperms has no native
#     dependencies and we want a single artifact that runs anywhere.
#   - `-s -w` strips the symbol table and DWARF data. `-X main.version=...`
#     and friends require `main.version` etc. to be `var` not `const` —
#     see the comment in cmd/tfperms/main.go.

version: 2

project_name: tfperms

before:
  hooks:
    - go mod tidy

builds:
  - id: tfperms
    main: ./cmd/tfperms
    binary: tfperms
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: tfperms
    ids:
      - tfperms
    # v2 uses `formats:` (plural list). v1 used `format:` (singular). Do
    # not "fix" this back to singular — the v2 schema check will reject it.
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

# Homebrew formula generation.
#
# Snapshot rendering (`goreleaser release --snapshot --clean`) writes the
# formula into `dist/homebrew/Formula/tfperms.rb` and never touches a remote.
# That is the only verification this story performs; full
# `brew install thoreinstein/tap/tfperms` is deferred to Epic 8 along with
# flipping `release.disable: false`.
#
# Non-snapshot publishing requires:
#   - HOMEBREW_TAP_GITHUB_TOKEN in the environment, set to a Personal Access
#     Token with `repo` scope on github.com/thoreinstein/homebrew-tap. The
#     default GITHUB_TOKEN is for this repo and cannot push to a different
#     org/repo.
#   - The tap repo `github.com/thoreinstein/homebrew-tap` must already exist,
#     created out-of-band (Epic 8 verifies this before the first tagged
#     release). GoReleaser's brews pipe will commit a Formula/tfperms.rb
#     into that repo on release; it does not create the repo.
#
# Snapshot mode does NOT need the token — `skip_upload: auto` plus snapshot
# semantics together guarantee no remote interaction during local runs.
#
# Schema note: GoReleaser v2 uses `directory:` for the path inside the tap
# repo. v1 (and some older docs/specs) say `folder:` — that key is rejected
# by `goreleaser check` against the v2 schema.
brews:
  - name: tfperms
    ids:
      - tfperms
    repository:
      owner: thoreinstein
      name: homebrew-tap
    directory: Formula
    homepage: "https://github.com/thoreinstein/tfperms"
    description: "Statically analyze Terraform GCP configs and report the minimum IAM permissions for plan and apply"
    # `url_template` is set explicitly because `release.disable: true` prevents
    # GoReleaser from deriving the default GitHub Releases URL. This template
    # matches the URL GitHub Releases will serve once Epic 8 flips
    # `release.disable` to false, so no edit is needed at that point.
    url_template: "https://github.com/thoreinstein/tfperms/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    skip_upload: auto
    test: |
      system "#{bin}/tfperms", "--version"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  # Snapshot version embeds the short commit so `--version` clearly differs
  # from the dev default `0.0.0-dev` — that is the Phase 3 verification.
  version_template: "{{ incpatch .Version }}-SNAPSHOT-{{ .ShortCommit }}"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "Merge pull request"
      - "Merge branch"

release:
  # Epic 8 flips this to false to enable GitHub Releases publishing. Until
  # then, every `goreleaser release` invocation must stay local-only.
  disable: true
