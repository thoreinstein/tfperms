# Cloud Run permission catalog.
#
# google_cloud_run_service is the Cloud Run v1 (Knative-shaped)
# resource. The Cloud Run v2 surface (google_cloud_run_v2_service) is
# tracked as a future entry; v1 still ships in the largest share of
# real-world configurations.
#
# Verified via the docs+source procedure (CONTRIBUTING.md). The
# non-obvious permission is iam.serviceAccounts.actAs at create-time:
# the deployed revision runs as the service's runtime service account
# (the default Compute Engine SA when none is set explicitly), which
# the deploying SA must be allowed to actAs.

resources:
  google_cloud_run_service:
    verification:
      method: docs+source
      source_urls:
        - https://cloud.google.com/run/docs/reference/iam/permissions
        - https://github.com/hashicorp/terraform-provider-google/blob/main/google/services/cloudrun/resource_cloud_run_service.go
      verified_at: "2026-05-05"
      verified_provider_version: "6.20.0"
    tested_against_provider: ">=6.0.0,<7.0.0"
    permissions:
      plan:
        - run.services.get
      create:
        - iam.serviceAccounts.actAs
        - run.services.create
      update:
        - run.services.update
      delete:
        - run.services.delete
