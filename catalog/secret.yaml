# Secret Manager permission catalog.
#
# Two entries cover the canonical "secret + version" pair. Verified
# via the docs+source procedure (CONTRIBUTING.md).
#
# google_secret_manager_secret_version has no GCP "update" permission:
# secret payloads are immutable once written, so any provider-level
# update path either disables / enables an existing version or
# destroys it. The catalog therefore folds enable/disable transitions
# into the update stage.

resources:
  google_secret_manager_secret:
    verification:
      method: docs+source
      source_urls:
        - https://cloud.google.com/secret-manager/docs/access-control
        - https://github.com/hashicorp/terraform-provider-google/blob/main/google/services/secretmanager/resource_secret_manager_secret.go
      verified_at: "2026-05-05"
      verified_provider_version: "6.20.0"
    tested_against_provider: ">=6.0.0,<7.0.0"
    permissions:
      plan:
        - secretmanager.secrets.get
      create:
        - secretmanager.secrets.create
      update:
        - secretmanager.secrets.update
      delete:
        - secretmanager.secrets.delete

  google_secret_manager_secret_version:
    verification:
      method: docs+source
      source_urls:
        - https://cloud.google.com/secret-manager/docs/access-control
        - https://github.com/hashicorp/terraform-provider-google/blob/main/google/services/secretmanager/resource_secret_manager_secret_version.go
      verified_at: "2026-05-05"
      verified_provider_version: "6.20.0"
    tested_against_provider: ">=6.0.0,<7.0.0"
    permissions:
      plan:
        - secretmanager.versions.get
      create:
        - secretmanager.versions.add
      # The provider toggles version state via enable / disable when
      # the `enabled` attribute changes; payload is immutable.
      update:
        - secretmanager.versions.disable
        - secretmanager.versions.enable
      delete:
        - secretmanager.versions.destroy
