# BigQuery permission catalog.
#
# Dataset and table cover the bulk of analytics Terraform
# configurations. Both entries use the docs+source verification
# procedure (CONTRIBUTING.md): API calls in the provider source were
# cross-referenced with the GCP IAM permission reference and mapped to
# one permission per Terraform lifecycle stage.

resources:
  google_bigquery_dataset:
    verification:
      method: docs+source
      source_urls:
        - https://cloud.google.com/bigquery/docs/access-control
        - https://github.com/hashicorp/terraform-provider-google/blob/main/google/services/bigquery/resource_bigquery_dataset.go
      verified_at: "2026-05-05"
      verified_provider_version: "6.20.0"
    tested_against_provider: ">=6.0.0,<7.0.0"
    permissions:
      plan:
        - bigquery.datasets.get
      create:
        - bigquery.datasets.create
      update:
        - bigquery.datasets.update
      delete:
        - bigquery.datasets.delete

  google_bigquery_table:
    verification:
      method: docs+source
      source_urls:
        - https://cloud.google.com/bigquery/docs/access-control
        - https://github.com/hashicorp/terraform-provider-google/blob/main/google/services/bigquery/resource_bigquery_table.go
      verified_at: "2026-05-05"
      verified_provider_version: "6.20.0"
    tested_against_provider: ">=6.0.0,<7.0.0"
    permissions:
      plan:
        - bigquery.tables.get
      create:
        - bigquery.tables.create
      update:
        - bigquery.tables.update
      delete:
        - bigquery.tables.delete
