# Pub/Sub permission catalog.
#
# Pub/Sub topics + subscriptions are the canonical event-driven backbone
# for GCP and the most-used messaging primitives. Both entries use the
# docs+source verification procedure (CONTRIBUTING.md): the provider
# source was cross-referenced with the GCP IAM permission reference to
# map each Terraform lifecycle stage to one IAM permission.

resources:
  google_pubsub_topic:
    verification:
      method: docs+source
      source_urls:
        - https://cloud.google.com/pubsub/docs/access-control
        - https://github.com/hashicorp/terraform-provider-google/blob/main/google/services/pubsub/resource_pubsub_topic.go
      verified_at: "2026-05-05"
      verified_provider_version: "6.20.0"
    tested_against_provider: ">=6.0.0,<7.0.0"
    permissions:
      plan:
        - pubsub.topics.get
      create:
        - pubsub.topics.create
      update:
        - pubsub.topics.update
      delete:
        - pubsub.topics.delete

  google_pubsub_subscription:
    verification:
      method: docs+source
      source_urls:
        - https://cloud.google.com/pubsub/docs/access-control
        - https://github.com/hashicorp/terraform-provider-google/blob/main/google/services/pubsub/resource_pubsub_subscription.go
      verified_at: "2026-05-05"
      verified_provider_version: "6.20.0"
    tested_against_provider: ">=6.0.0,<7.0.0"
    permissions:
      plan:
        - pubsub.subscriptions.get
      create:
        - pubsub.subscriptions.create
      update:
        - pubsub.subscriptions.update
      delete:
        - pubsub.subscriptions.delete
