# GCS / Cloud Storage permission catalog.
#
# This file is the canonical example for the tfperms permission catalog.
# It exercises every supported schema feature so contributors adding a
# new service file have a complete reference. Keep it tidy:
#
#   - One Terraform resource type per entry.
#   - Permissions sorted alphabetically per list.
#   - Comments above non-obvious permissions explaining when they fire.
#
# Permission strings are GCP IAM permission identifiers
# (service.resource.verb), NOT roles. Roles are constructed downstream
# by the analyzer from these permissions.
#
# Every entry MUST carry full verification provenance — see
# CONTRIBUTING.md for the catalog verification procedure.

resources:
  google_storage_bucket:
    verification:
      method: docs+source
      source_urls:
        - https://cloud.google.com/storage/docs/access-control/iam-permissions
        - https://github.com/hashicorp/terraform-provider-google/blob/main/google/services/storage/resource_storage_bucket.go
      verified_at: "2025-12-15"
      verified_provider_version: "6.12.0"
    tested_against_provider: ">=5.0.0,<7.0.0"
    permissions:
      # Bucket reads happen during refresh.
      plan:
        - storage.buckets.get
      create:
        - storage.buckets.create
      update:
        - storage.buckets.update
      delete:
        - storage.buckets.delete
    conditionals:
      # Bucket-level IAM is only managed when uniform_bucket_level_access
      # is true; without it, ACLs are the surface and IAM permissions
      # are not exercised by the resource.
      - when:
          uniform_bucket_level_access: true
        permissions:
          plan:
            - storage.buckets.getIamPolicy
          create:
            - storage.buckets.setIamPolicy
          update:
            - storage.buckets.setIamPolicy

  google_storage_bucket_object:
    verification:
      method: docs+source
      source_urls:
        - https://cloud.google.com/storage/docs/access-control/iam-permissions
        - https://github.com/hashicorp/terraform-provider-google/blob/main/google/services/storage/resource_storage_bucket_object.go
      verified_at: "2025-12-15"
      verified_provider_version: "6.12.0"
    tested_against_provider: ">=5.0.0,<7.0.0"
    permissions:
      plan:
        - storage.objects.get
      create:
        - storage.objects.create
      update:
        - storage.objects.update
      delete:
        - storage.objects.delete

  # Bucket-level Pub/Sub notification. GCS notifications are immutable
  # — any field change is delete + recreate — so the catalog has no
  # update permission to grant.
  #
  # The notification's destination Pub/Sub topic must already grant
  # `pubsub.topics.publish` to the GCS service account (the project's
  # service-{PROJECT_NUMBER}@gs-project-accounts.iam.gserviceaccount.com).
  # That grant is set up via a separate google_pubsub_topic_iam_member
  # resource and so is not included in the notification's permission
  # list — it would otherwise show up under every notification entry
  # even when the operator already prepared the topic.
  google_storage_notification:
    verification:
      method: docs+source
      source_urls:
        - https://cloud.google.com/storage/docs/access-control/iam-permissions
        - https://github.com/hashicorp/terraform-provider-google/blob/main/google/services/storage/resource_storage_notification.go
      verified_at: "2026-05-05"
      verified_provider_version: "6.20.0"
    tested_against_provider: ">=6.0.0,<7.0.0"
    permissions:
      plan:
        - storage.objects.list
      create:
        - storage.objects.list
      update: []
      delete:
        - storage.objects.list

data_sources:
  # Reading bucket metadata for downstream interpolation. No write
  # permissions because data sources are read-only at the GCP API
  # level — even refresh on apply only re-reads.
  google_storage_bucket:
    verification:
      method: docs+source
      source_urls:
        - https://cloud.google.com/storage/docs/access-control/iam-permissions
        - https://github.com/hashicorp/terraform-provider-google/blob/main/google/services/storage/data_source_storage_bucket.go
      verified_at: "2025-12-15"
      verified_provider_version: "6.12.0"
    tested_against_provider: ">=5.0.0,<7.0.0"
    permissions:
      plan:
        - storage.buckets.get

iam_bindings:
  # The three IAM binding flavours all pivot on the same underlying API:
  # plan reads getIamPolicy; create / update / delete each call
  # setIamPolicy. The lists are repeated across stages by design —
  # see catalog.go's IAMBindingEntry doc for the rationale.
  google_storage_bucket_iam_binding:
    parent_resource: google_storage_bucket
    verification:
      method: docs+source
      source_urls:
        - https://cloud.google.com/storage/docs/access-control/iam-permissions
        - https://github.com/hashicorp/terraform-provider-google/blob/main/google/services/storage/iam_storage_bucket.go
      verified_at: "2025-12-15"
      verified_provider_version: "6.12.0"
    tested_against_provider: ">=5.0.0,<7.0.0"
    permissions:
      plan:
        - storage.buckets.getIamPolicy
      create:
        - storage.buckets.setIamPolicy
      update:
        - storage.buckets.setIamPolicy
      delete:
        - storage.buckets.setIamPolicy

  google_storage_bucket_iam_member:
    parent_resource: google_storage_bucket
    verification:
      method: docs+source
      source_urls:
        - https://cloud.google.com/storage/docs/access-control/iam-permissions
        - https://github.com/hashicorp/terraform-provider-google/blob/main/google/services/storage/iam_storage_bucket.go
      verified_at: "2025-12-15"
      verified_provider_version: "6.12.0"
    tested_against_provider: ">=5.0.0,<7.0.0"
    permissions:
      plan:
        - storage.buckets.getIamPolicy
      create:
        - storage.buckets.setIamPolicy
      update:
        - storage.buckets.setIamPolicy
      delete:
        - storage.buckets.setIamPolicy

  google_storage_bucket_iam_policy:
    parent_resource: google_storage_bucket
    verification:
      method: docs+source
      source_urls:
        - https://cloud.google.com/storage/docs/access-control/iam-permissions
        - https://github.com/hashicorp/terraform-provider-google/blob/main/google/services/storage/iam_storage_bucket.go
      verified_at: "2025-12-15"
      verified_provider_version: "6.12.0"
    tested_against_provider: ">=5.0.0,<7.0.0"
    permissions:
      plan:
        - storage.buckets.getIamPolicy
      create:
        - storage.buckets.setIamPolicy
      update:
        - storage.buckets.setIamPolicy
      delete:
        - storage.buckets.setIamPolicy
