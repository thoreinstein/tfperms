# Compute Engine permission catalog.
#
# Covers the core VPC + VM trio that nearly every GCP Terraform
# configuration touches: instances, networks, and subnetworks. Each
# entry is empirically verified per the Epic 4 top-tier procedure
# (CONTRIBUTING.md): a least-privilege service account was iteratively
# granted the listed permissions until terraform plan / apply / destroy
# completed without IAM errors against terraform-provider-google
# 6.20.0.
#
# Resource style follows storage.yaml: one resource per entry,
# permissions sorted alphabetically per stage, comments above
# non-obvious entries.

resources:
  google_compute_instance:
    # Empirically verified by creating, updating (label / metadata
    # change), and destroying a minimal VM (e2-micro, debian-12 boot
    # disk, default-VPC subnetwork) in a clean GCP project. The
    # service account additionally requires iam.serviceAccounts.actAs
    # because the VM runs as the default Compute Engine SA;
    # compute.subnetworks.use is required to attach the network
    # interface.
    verification:
      method: empirical
      source_urls:
        - https://cloud.google.com/compute/docs/access/iam
        - https://github.com/hashicorp/terraform-provider-google/blob/main/google/services/compute/resource_compute_instance.go
      verified_at: "2026-05-05"
      verified_provider_version: "6.20.0"
    tested_against_provider: ">=6.0.0,<7.0.0"
    permissions:
      plan:
        - compute.instances.get
      create:
        # Boot disk creation when initialize_params is set (the common
        # case); the disk is created alongside the instance.
        - compute.disks.create
        - compute.instances.create
        # Required to attach the network interface to the chosen
        # subnetwork even when using the default network.
        - compute.subnetworks.use
        # The default service_account block runs the VM as the default
        # Compute Engine SA, which the deploying SA must be allowed to
        # actAs.
        - iam.serviceAccounts.actAs
      update:
        # In-place updates land on these endpoints depending on which
        # attribute changed: setMetadata for metadata, setTags for
        # network tags, and the generic update for machine_type /
        # min_cpu_platform changes (which require a stop/start that
        # the provider performs automatically).
        - compute.instances.setMetadata
        - compute.instances.setTags
        - compute.instances.update
      delete:
        - compute.disks.delete
        - compute.instances.delete

  google_compute_network:
    verification:
      method: empirical
      source_urls:
        - https://cloud.google.com/compute/docs/access/iam
        - https://github.com/hashicorp/terraform-provider-google/blob/main/google/services/compute/resource_compute_network.go
      verified_at: "2026-05-05"
      verified_provider_version: "6.20.0"
    tested_against_provider: ">=6.0.0,<7.0.0"
    permissions:
      plan:
        - compute.networks.get
      create:
        - compute.networks.create
      update:
        - compute.networks.update
      delete:
        - compute.networks.delete

  google_compute_subnetwork:
    verification:
      method: empirical
      source_urls:
        - https://cloud.google.com/compute/docs/access/iam
        - https://github.com/hashicorp/terraform-provider-google/blob/main/google/services/compute/resource_compute_subnetwork.go
      verified_at: "2026-05-05"
      verified_provider_version: "6.20.0"
    tested_against_provider: ">=6.0.0,<7.0.0"
    permissions:
      plan:
        - compute.subnetworks.get
      create:
        - compute.subnetworks.create
      update:
        - compute.subnetworks.update
      delete:
        - compute.subnetworks.delete
