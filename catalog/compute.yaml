# Compute Engine permission catalog.
#
# Covers the core VPC + VM trio that nearly every GCP Terraform
# configuration touches: instances, networks, and subnetworks. Each
# entry is verified via the docs+source procedure (CONTRIBUTING.md):
# the API calls in the provider source were cross-referenced with the
# GCP IAM permission reference, and one IAM permission was recorded
# per Terraform lifecycle stage.
#
# Resource style follows storage.yaml: one resource per entry,
# permissions sorted alphabetically per stage, comments above
# non-obvious entries.

resources:
  google_compute_instance:
    # The non-obvious permissions here come from secondary API calls
    # the provider issues during create:
    #
    #   - compute.disks.create — the boot disk in initialize_params is
    #     created alongside the instance.
    #   - compute.subnetworks.use — required to attach the network
    #     interface to the chosen (or default) subnetwork.
    #   - iam.serviceAccounts.actAs — the VM runs as a service account
    #     (the default Compute Engine SA when none is specified), and
    #     the deploying SA must be allowed to actAs it.
    #
    # In-place updates land on setMetadata / setTags / update depending
    # on which attribute changed (machine_type / min_cpu_platform
    # changes trigger a stop/start that the provider performs
    # automatically, hitting the generic update endpoint).
    verification:
      method: docs+source
      source_urls:
        - https://cloud.google.com/compute/docs/access/iam
        - https://github.com/hashicorp/terraform-provider-google/blob/main/google/services/compute/resource_compute_instance.go
      verified_at: "2026-05-05"
      verified_provider_version: "6.20.0"
    tested_against_provider: ">=6.0.0,<7.0.0"
    permissions:
      plan:
        - compute.instances.get
      create:
        - compute.disks.create
        - compute.instances.create
        - compute.subnetworks.use
        - iam.serviceAccounts.actAs
      update:
        - compute.instances.setMetadata
        - compute.instances.setTags
        - compute.instances.update
      delete:
        - compute.disks.delete
        - compute.instances.delete

  google_compute_network:
    verification:
      method: docs+source
      source_urls:
        - https://cloud.google.com/compute/docs/access/iam
        - https://github.com/hashicorp/terraform-provider-google/blob/main/google/services/compute/resource_compute_network.go
      verified_at: "2026-05-05"
      verified_provider_version: "6.20.0"
    tested_against_provider: ">=6.0.0,<7.0.0"
    permissions:
      plan:
        - compute.networks.get
      create:
        - compute.networks.create
      update:
        - compute.networks.update
      delete:
        - compute.networks.delete

  google_compute_subnetwork:
    verification:
      method: docs+source
      source_urls:
        - https://cloud.google.com/compute/docs/access/iam
        - https://github.com/hashicorp/terraform-provider-google/blob/main/google/services/compute/resource_compute_subnetwork.go
      verified_at: "2026-05-05"
      verified_provider_version: "6.20.0"
    tested_against_provider: ">=6.0.0,<7.0.0"
    permissions:
      plan:
        - compute.subnetworks.get
      create:
        - compute.subnetworks.create
      update:
        - compute.subnetworks.update
      delete:
        - compute.subnetworks.delete
