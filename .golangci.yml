# golangci-lint configuration.
#
# Schema: v1 (https://golangci-lint.run/usage/configuration/). CI runs
# golangci-lint v1.64.8, which rejects the v2-only `version` and
# `formatters` keys at the document root.
#
# errcheck/govet/ineffassign/staticcheck are default-enabled, but we list
# them explicitly so a future default-set change cannot silently weaken
# our floor. `gofmt` is a linter under the v1 schema.

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - gofmt
