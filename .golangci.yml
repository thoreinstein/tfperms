# golangci-lint configuration.
#
# Linter selection mirrors the project spec. errcheck/govet/ineffassign/
# staticcheck are default-enabled by golangci-lint, but we list them
# explicitly so a future default-set change cannot silently weaken our
# floor. `gofmt` is included as a linter (v1 schema).

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - gofmt
